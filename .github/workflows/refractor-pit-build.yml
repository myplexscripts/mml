name: Build Refractor Pit Windows

on:
  push:
    branches:
      - ballpit-godot-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode embedded MML render assets
        run: |
          set -euxo pipefail
          mkdir -p assets/renders
          if compgen -G "embedded_assets/renders/*.b64" > /dev/null; then
            for f in embedded_assets/renders/*.b64; do
              out="assets/renders/$(basename "${f%.b64}").png"
              base64 -d "$f" > "$out"
            done
          fi

      - name: Install Godot 4.7.2
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and validate project
        run: |
          set -uo pipefail
          set +e
          timeout 120s godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-import.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Smoke test main scene
        run: |
          set -uo pipefail
          set +e
          timeout 8s godot --headless --path . 2>&1 | tee godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-runtime.log; then
            echo "Godot runtime smoke test failed"
            exit 1
          fi

      - name: Export Windows EXE
        run: |
          set -uo pipefail
          mkdir -p build/windows
          set +e
          godot --headless --path . --export-release "Windows Desktop" "build/windows/Mega Man Legends - Refractor Pit.exe" 2>&1 | tee godot-export.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-export.log; then
            echo "Godot export reported script errors"
            exit 1
          fi
          test -s "build/windows/Mega Man Legends - Refractor Pit.exe"
          ls -lh build/windows

      - name: Package Windows build
        run: |
          set -euxo pipefail
          cd build/windows
          sha256sum "Mega Man Legends - Refractor Pit.exe" > SHA256.txt
          zip -9 "MML-Refractor-Pit-Windows.zip" "Mega Man Legends - Refractor Pit.exe" SHA256.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mml-refractor-pit-windows
          path: build/windows/MML-Refractor-Pit-Windows.zip
          if-no-files-found: error
