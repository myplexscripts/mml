name: Build Refractor Pit Windows

on:
  push:
    branches:
      - ballpit-godot-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode embedded MML render assets
        run: |
          set -euxo pipefail
          mkdir -p assets/renders
          if compgen -G "embedded_assets/renders/*.b64" > /dev/null; then
            for f in embedded_assets/renders/*.b64; do
              out="assets/renders/$(basename "${f%.b64}").png"
              base64 -d "$f" > "$out"
            done
          fi

      - name: Extract playable frames from MML sprite sheets
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image

          frames = {
              "assets/characters/megaman.png": (0, 0, 38, 45),
              "assets/characters/roll.png": (0, 0, 24, 36),
              "assets/characters/horokko.png": (0, 0, 48, 48),
              "assets/characters/zakobon.png": (0, 0, 48, 48),
              "assets/characters/sharukurusu.png": (0, 0, 48, 48),
          }
          for path, box in frames.items():
              image = Image.open(path).convert("RGBA")
              frame = image.crop(box)
              frame.save(path)
              print(f"{path}: {image.size} -> {frame.size}")
          PY

      - name: Integrate Hanmuru boss art and QA capture timing
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/refractor_pit_runtime.gd")
          text = path.read_text()
          text = text.replace(
              'const TEX_GUARDIAN: Texture2D = preload("res://assets/characters/guardian.png")\n',
              'const TEX_GUARDIAN: Texture2D = preload("res://assets/characters/guardian.png")\nconst TEX_HANMURU: Texture2D = preload("res://assets/characters/hanmuru_doll.png")\n',
              1,
          )
          text = text.replace(
              '"name": "HANMURU DOLL",\n        "tex": TEX_GUARDIAN,\n        "pos": Vector2(640.0, 150.0),',
              '"name": "HANMURU DOLL",\n        "tex": TEX_HANMURU,\n        "pos": Vector2(640.0, 150.0),',
              1,
          )
          text = text.replace(
              '    new_run()\n    spawn_wave()\n',
              '    new_run()\n    radio_timer = 0.0\n    message_timer = 0.0\n    spawn_wave()\n',
              1,
          )
          text = text.replace(
              '    mode = "terminal"\n    await get_tree().process_frame\n    save_runtime_screen(screen_dir.path_join("04_development_terminal.png"))',
              '    mode = "terminal"\n    radio_timer = 0.0\n    message_timer = 0.0\n    queue_redraw()\n    await get_tree().process_frame\n    await get_tree().process_frame\n    save_runtime_screen(screen_dir.path_join("04_development_terminal.png"))',
              1,
          )
          text = text.replace(
              '    mode = "run"\n    enemies.clear()\n    enemy_shots.clear()\n    spawn_boss()',
              '    mode = "run"\n    radio_timer = 0.0\n    message_timer = 0.0\n    enemies.clear()\n    enemy_shots.clear()\n    spawn_boss()',
              1,
          )
          path.write_text(text)
          assert 'TEX_HANMURU' in text
          assert '"tex": TEX_HANMURU' in text
          PY

      - name: Install Godot 4.7.2
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install export templates and Xvfb
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Import and validate project
        run: |
          set -uo pipefail
          set +e
          timeout 120s godot --headless --audio-driver Dummy --path . --editor --quit 2>&1 | tee godot-import.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-import.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Smoke test main scene
        run: |
          set -uo pipefail
          set +e
          timeout 8s godot --headless --audio-driver Dummy --path . 2>&1 | tee godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-runtime.log; then
            echo "Godot runtime smoke test failed"
            exit 1
          fi

      - name: Verify gameplay mechanics
        run: |
          set -uo pipefail
          set +e
          timeout 30s godot --headless --audio-driver Dummy --path . -- --self-test 2>&1 | tee godot-selftest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cat godot-selftest.log
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|push_error" godot-selftest.log; then
            echo "Godot mechanics self-test reported an error"
            exit 1
          fi
          grep -q "SELFTEST PASS" godot-selftest.log

      - name: Capture actual runtime screenshots
        run: |
          set -uo pipefail
          mkdir -p build/screens
          set +e
          timeout 45s xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path . -- --capture-screens 2>&1 | tee godot-capture.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cat godot-capture.log
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-capture.log; then
            echo "Runtime capture reported a Godot error"
            exit 1
          fi
          grep -q "CAPTURE PASS" godot-capture.log
          for f in 01_menu.png 02_early_combat.png 03_dense_combat.png 04_development_terminal.png 05_boss.png; do
            test -s "build/screens/$f"
          done
          ls -lh build/screens

      - name: Export Windows EXE
        run: |
          set -uo pipefail
          mkdir -p build/windows
          set +e
          godot --headless --audio-driver Dummy --path . --export-release "Windows Desktop" "build/windows/Mega Man Legends - Refractor Pit.exe" 2>&1 | tee godot-export.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" godot-export.log; then
            echo "Godot export reported script errors"
            exit 1
          fi
          test -s "build/windows/Mega Man Legends - Refractor Pit.exe"
          ls -lh build/windows

      - name: Package Windows build
        run: |
          set -euxo pipefail
          cd build/windows
          sha256sum "Mega Man Legends - Refractor Pit.exe" > SHA256.txt
          zip -9 "MML-Refractor-Pit-Windows.zip" "Mega Man Legends - Refractor Pit.exe" SHA256.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mml-refractor-pit-windows
          path: build/windows/MML-Refractor-Pit-Windows.zip
          if-no-files-found: error

      - name: Upload runtime screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mml-refractor-pit-runtime-screens
          path: build/screens/*.png
          if-no-files-found: error
