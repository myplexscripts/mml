name: Game checks and builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate gameplay and export Windows and Web
        run: python tools/check_game.py --godot godot --export

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KatteloxDays-Windows
          path: build/windows/
          if-no-files-found: error

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: KatteloxDays-Web
          path: build/web/
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KatteloxDays-Validation
          path: build/check-*.log
          if-no-files-found: warn
